name: RSSD center checks
on:
  pull_request:
  push:
    branches: [rssd, 'codex/rssd-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  center:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rssd_test
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: rssd_center_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rssd_test -d rssd_center_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RSSD_TEST_DATABASE_URL: postgresql://rssd_test:fixture-only-password@localhost:5432/rssd_center_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate diff --from-empty --to-schema-datamodel libraries/nestjs-libraries/src/database/prisma/schema.prisma --script --output rssd/postiz-schema.sql
      # These files bootstrap the same disposable database. File-level
      # serialization prevents concurrent CREATE IF NOT EXISTS races; each
      # file's internal concurrency tests still run normally.
      - run: node --test --test-concurrency=1 rssd/coordination.test.cjs rssd/store.test.cjs rssd/discourse.test.cjs rssd/postiz.test.cjs rssd/initialize-database.test.cjs rssd/owner-context.test.cjs rssd/health.test.cjs rssd/labels.test.cjs rssd/community.test.cjs rssd/private-review.test.cjs
      - run: pnpm --filter postiz-backend build
      - run: node --test rssd/http.test.cjs rssd/body-parsers.test.cjs rssd/private-review-http.test.cjs
      - name: Create dedicated private-import test database
        run: PGPASSWORD=fixture-only-password createdb -h localhost -U rssd_test rssd_import_test
      - name: Test restricted private import and Postiz grant routes
        run: RSSD_TEST_DATABASE_URL=postgresql://rssd_test:fixture-only-password@localhost:5432/rssd_import_test node --test rssd/private-import-secure.test.mjs
      - run: node --test rssd/private-import-secrets.test.mjs
      - run: node --test rssd/private-import-socket.test.mjs
      - run: python3 -m unittest discover -s rssd -p test_private_import_archive.py -v
      - run: pnpm exec tsc --noEmit -p apps/frontend/tsconfig.json
      - run: pnpm exec jest --config rssd/jest-ui.config.cjs --runInBand
      - run: sudo apt-get update && sudo apt-get install -y age rclone
      - run: python3 -m unittest discover -s rssd -p test_backup.py -v
      - run: python3 -m unittest discover -s rssd -p test_drive_authorization.py -v
      - name: Verify packaged domain runtime
        run: node -e "for(const name of ['body-parsers','store','publisher','media','migration','editorial','editorial-actions','private-review'])require('./apps/backend/dist/rssd/'+name+'.cjs');for(const name of ['private-import-owner','private-import-secure-roles','private-import-secure-adapter','private-import-startup','private-import-secrets'])require('./apps/backend/dist/rssd/'+name+'.mjs')"
