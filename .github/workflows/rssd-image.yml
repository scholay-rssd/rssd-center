name: Center AMD64 image space measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Measure independently pulled official images
        shell: bash
        run: |
          set -euo pipefail
          old='ghcr.io/scholay-rssd/rssd-center@sha256:d550dd8e433c39a25da7d38b1097c75522f9f29e88fec478b7766c2a24da12a3'
          new='ghcr.io/scholay-rssd/rssd-center@sha256:2c9b5124221c22ddad8e79afdc60c6fc053ba582ca99eacaa7ef8ba2e9be85e1'
          docker pull --platform linux/amd64 "$old" >/dev/null
          old_free=$(df -B1 --output=avail /var/lib/docker | tail -1 | tr -d ' ')
          docker pull --platform linux/amd64 "$new" >/dev/null
          new_free=$(df -B1 --output=avail /var/lib/docker | tail -1 | tr -d ' ')
          echo "OLD_IMAGE_BYTES=$(docker image inspect --format '{{.Size}}' "$old")"
          echo "NEW_IMAGE_BYTES=$(docker image inspect --format '{{.Size}}' "$new")"
          echo "INCREMENTAL_DISK_BYTES=$((old_free-new_free))"
          docker system df
