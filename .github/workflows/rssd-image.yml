name: Compare official Center image contents
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Compare all application files and permissions
        shell: bash
        run: |
          set -euo pipefail
          old='ghcr.io/scholay-rssd/rssd-center@sha256:d550dd8e433c39a25da7d38b1097c75522f9f29e88fec478b7766c2a24da12a3'
          new='ghcr.io/scholay-rssd/rssd-center@sha256:2c9b5124221c22ddad8e79afdc60c6fc053ba582ca99eacaa7ef8ba2e9be85e1'
          docker pull --platform linux/amd64 "$old" >/dev/null
          docker pull --platform linux/amd64 "$new" >/dev/null
          for version in old new; do
            ref=${!version}
            docker run --rm --network none --entrypoint sh "$ref" -c 'cd /; find app usr etc bin lib sbin -type f ! -path etc/hostname ! -path etc/hosts ! -path etc/resolv.conf -exec sha256sum {} + | LC_ALL=C sort -k2' > "$version.hashes"
            docker run --rm --network none --entrypoint sh "$ref" -c 'cd /; find app usr etc bin lib sbin \( -type f -o -type d -o -type l \) ! -path etc/hostname ! -path etc/hosts ! -path etc/resolv.conf -printf "%p %y %m %u:%g %l\n" | LC_ALL=C sort' > "$version.metadata"
          done
          python3 - <<'PY'
          from collections import Counter
          def read(path):
              return {name:sha for sha,name in (line.rstrip('\n').split('  ',1) for line in open(path))}
          old,new=read('old.hashes'),read('new.hashes')
          changed=sorted(k for k in old.keys()|new.keys() if old.get(k)!=new.get(k))
          with open('changed-files.txt','w') as out:
              for k in changed:print(('ADD' if k not in old else 'REMOVE' if k not in new else 'CHANGE'),k,file=out)
          print('FILE_COUNTS',len(old),len(new),'CHANGED',len(changed))
          for prefix,n in Counter('/'.join(k.split('/')[:5]) for k in changed).most_common(40):print('CHANGED_GROUP',n,prefix)
          a=set(open('old.metadata'));b=set(open('new.metadata'))
          with open('changed-metadata.txt','w') as out:
              for row in sorted(a-b):out.write('OLD '+row)
              for row in sorted(b-a):out.write('NEW '+row)
          print('METADATA_CHANGED_LINES',len(a-b)+len(b-a))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: official-image-difference
          path: |
            changed-files.txt
            changed-metadata.txt
          if-no-files-found: error
